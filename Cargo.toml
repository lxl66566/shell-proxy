[package]
name         = "shell-proxy"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
description  = "Run local commands on a remote Linux host with persistent shell state"
repository   = "https://github.com/lxl66566/shell-proxy"
license      = "MIT OR Apache-2.0"
keywords     = ["cli", "proxy", "remote", "shell", "ssh"]
categories   = ["command-line-utilities", "development-tools"]
build        = "build.rs"
include      = ["/CHANGELOG.md", "/LICENSE-*", "/README.md", "/build.rs", "/crates/**", "/src/**", "/tests/**"]

[workspace]
members = ["crates/sp-proto", "crates/sp-serve"]

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[workspace.lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[lib]
name = "shell_proxy"

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
dirs       = "7"
hex-simd   = "0.8"
rand       = "0.10"
rmcp       = { version = "3", features = ["transport-io"] }
russh      = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
schemars   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.11"
sp-proto   = { path = "crates/sp-proto", version = "0.1" }
spdlog-rs  = { version = "0.5", features = ["flexible-string"] }
thiserror  = "2"
tokio      = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time"
] }
toml       = "1"

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
signal-hook = "0.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  # Security is required by CreateProcessW's SECURITY_ATTRIBUTES parameters
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Threading"
] }

[lints]
workspace = true

[profile.release]
opt-level = "s"
strip     = true
lto       = true
panic     = "abort"
